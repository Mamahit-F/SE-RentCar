server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: rental-partnership-backend

  # ============================================================
  # DATABASE CONFIGURATION (PostgreSQL)
  # ============================================================
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rental_partnership}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: RentalPartnershipHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1800000

  # ============================================================
  # JPA / HIBERNATE CONFIGURATION
  # ============================================================
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC
    open-in-view: false

  # ============================================================
  # JACKSON (JSON Serialization)
  # ============================================================
  jackson:
    time-zone: Asia/Jakarta
    serialization:
      write-dates-as-timestamps: false

# ============================================================
# JWT CONFIGURATION (akan digunakan pada Phase 5)
# ============================================================
app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 jam

# ============================================================
# CORS CONFIGURATION
# ============================================================
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:3000}

# ============================================================
# SPRINGDOC / SWAGGER UI
# ============================================================
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
